<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <title>Swagger UI — Flask AJAX API</title>
    <!-- Swagger UI 從 CDN 載入，規格檔是同目錄的 openapi.yaml（對應講義 2-5） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
    SwaggerUIBundle({
        url: '/openapi.yaml',
        dom_id: '#swagger-ui',
        persistAuthorization: true,   // 重新整理頁面後 Authorize 貼過的 token 還在
    });
</script>
</body>
</html>
