<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>260 FormData 上傳圖檔，結果顯示在 Bootstrap Modal</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">上傳圖檔</h5>

              <form name="form1">
                <div class="mb-3">
                  <label for="" class="form-label">檔案</label>
                  <input type="file" class="form-control" name="file" />
                  <div class="form-text"></div>
                </div>
                <div class="mb-3">
                  <label for="note" class="form-label">備註</label>
                  <input
                    type="text"
                    class="form-control"
                    id="note"
                    name="note"
                  />
                  <div class="form-text"></div>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">上傳結果</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-success" role="alert">上傳成功！</div>
            <div class="row mt-4">
              <div class="col">
                <img src="" alt="" id="myimg" class="img-fluid" width="100%" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              關閉
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // 先建立 Modal 物件，上傳成功後才呼叫 show()
      const myModal = new bootstrap.Modal("#exampleModal");

      const mySubmit = async (e) => {
        e.preventDefault(); // 避免預設行為 (不要讓表單送出)

        const fd = new FormData(document.form1); // 複製表單內容成為 FormData 物件

        const r = await fetch("/api/fruits/upload", {
          method: "POST",
          body: fd, // FormData, Content-Type 自動預設 multipart/form-data
        });
        // fetch 遇到 400、500 不會丟例外（見 190），要自己檢查 r.ok
        if (!r.ok) {
          alert("上傳失敗");
          return;
        }
        const result = await r.json();
        console.log(result);
        // 有 url 才算成功：放進 <img> 並打開 Modal 顯示結果
        if (result.url) {
          $("#myimg").attr("src", result.url);
          myModal.show();
        } else {
          alert("上傳失敗");
        }
      };

      document.form1.addEventListener("submit", mySubmit); // 註冊事件處理器
    </script>
  </body>
</html>
