<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>240 FormData 上傳圖檔並顯示</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">上傳圖檔</h5>

              <form name="form1">
                <div class="mb-3">
                  <label for="" class="form-label">檔案</label>
                  <input type="file" class="form-control" name="file" />
                  <div class="form-text"></div>
                </div>
                <div class="mb-3">
                  <label for="note" class="form-label">備註</label>
                  <input
                    type="text"
                    class="form-control"
                    id="note"
                    name="note"
                  />
                  <div class="form-text"></div>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <img src="" alt="" id="myimg" />
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
      // 上傳檔案要用 multipart/form-data，直接把 FormData 當 body 交給 fetch 即可。
      // 注意「不要」自己設 Content-Type，瀏覽器會連 boundary 一起產生；自己設反而會壞
      const mySubmit = async (e) => {
        e.preventDefault(); // 避免預設行為 (不要讓表單送出)

        const fd = new FormData(document.form1); // 複製表單內容成為 FormData 物件

        const r = await fetch("/api/fruits/upload", {
          method: "POST",
          body: fd, // FormData, Content-Type 自動預設 multipart/form-data
        });
        const result = await r.json(); // 後端回 { url, ... }

        $("#myimg").attr("src", result.url); // 把上傳後的網址放進 <img> 立刻預覽

        console.log(result);
      };

      document.form1.addEventListener("submit", mySubmit); // 註冊事件處理器
    </script>
  </body>
</html>
