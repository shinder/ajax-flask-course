<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>220 表單欄位逐一取值後 fetch POST</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Card title</h5>
              <!--
              <form onsubmit="mySubmit(event)">
              -->
              <form name="form1">
                <div class="mb-3">
                  <label for="pName" class="form-label">產品名稱</label>
                  <input
                    type="text"
                    class="form-control"
                    id="pName"
                    name="pName"
                  />
                  <div class="form-text"></div>
                </div>
                <div class="mb-3">
                  <label for="pPrice" class="form-label">產品價格</label>
                  <input
                    type="number"
                    class="form-control"
                    id="pPrice"
                    name="pPrice"
                  />
                  <div class="form-text"></div>
                </div>
                <div class="mb-3">
                  <label for="pImage" class="form-label">產品圖</label>
                  <input
                    type="text"
                    class="form-control"
                    id="pImage"
                    name="pImage"
                    value="https://www.aaa.com/image.jpg"
                  />
                  <div class="form-text"></div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script>
      // 攔截表單的 submit 事件，改用 fetch 送 JSON，頁面不會重新載入。
      // 這一版是「逐一取值」：document.form1.pName 透過 <form name> 與欄位的 name 存取
      const mySubmit = async (e) => {
        e.preventDefault(); // 避免預設行為 (不要讓表單送出)
        const data = {
          name: document.form1.pName.value,
          price: document.form1.pPrice.value,
          imageUrl: document.form1.pImage.value,
        };
        console.log(data);
        const r = await fetch("/api/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });
        const result = await r.text(); // 視為純文字：成功是 JSON、驗證失敗是 Problem Details，先看原始內容

        alert(result);
      };

      document.form1.addEventListener("submit", mySubmit); // 註冊事件處理器
    </script>
  </body>
</html>
