[project]
name = "my-ajax-api"
version = "0.1.0"
description = "課程講義《AJAX + RESTful API 使用 Flask》的範例 API"
readme = "README.md"
authors = [
    { name = "Shinder Lin", email = "shinder.lin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
# uv run my-ajax-api 會呼叫 my_ajax_api/__init__.py 的 main()
my-ajax-api = "my_ajax_api:main"

[build-system]
# 有這一段，uv sync 會把 src/my_ajax_api 以可編輯模式裝進 .venv，
# 之後不管從哪個目錄執行、測試放在哪裡，import my_ajax_api 都找得到
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
