[project]
name = "my-ajax-api"
version = "0.1.0"
description = "課程講義《AJAX + RESTful API 使用 Flask》的範例 API"
readme = "README.md"
authors = [
    { name = "Shinder Lin", email = "shinder.lin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
# uv run my-ajax-api 會呼叫 my_ajax_api/__init__.py 的 main()
my-ajax-api = "my_ajax_api:main"

[build-system]
# 有這一段，uv sync 會把 src/my_ajax_api 以可編輯模式裝進 .venv，
# 之後不管從哪個目錄執行、測試放在哪裡，import my_ajax_api 都找得到
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
# ruff 0.16 起會連 Markdown 裡的程式碼區塊一起格式化；docs/ 是講義的連結，不要動
extend-exclude = ["*.md"]

[tool.ruff.lint]
# ruff 0.16 大幅擴大了預設規則集（UP、B、SIM…）。教學專案維持舊預設（E4/E7/E9/F）
# 加 import 排序（I），避免為了通過檢查改寫教材上刻意示範的寫法
select = ["E4", "E7", "E9", "F", "I"]
